name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full

      - name: Install dependencies
        run: raco pkg install --auto --no-docs markdown http-easy

      - name: Install package
        run: raco pkg install --auto --no-docs --link "$(pwd)"

      - name: Run tests
        run: raco test -p yinwangdl

      - name: Lint posts
        run: raco yinwangdl lint

      - name: Build the site
        run: raco yinwangdl build
