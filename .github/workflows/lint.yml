name: Lint Posts

on:
  push:
    paths:
      - 'posts/**'
      - 'yinwangdl/**'
      - '.github/workflows/lint.yml'
  pull_request:
    paths:
      - 'posts/**'
      - 'yinwangdl/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full

      - name: Install dependencies
        run: raco pkg install --auto --no-docs markdown http-easy

      - name: Install package
        run: raco pkg install --auto --no-docs --link "$(pwd)"

      - name: Lint posts
        run: raco yinwangdl lint
